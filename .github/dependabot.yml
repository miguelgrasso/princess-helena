version: 2
updates:
  # Base de nginx en el Dockerfile (actualiza tag + digest en ambos FROM)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # nginx: minor impar = mainline, par = stable. Dependabot no lo sabe y
      # propondría 1.30 -> 1.31 (mainline). Sólo aceptamos parches de la stable;
      # el salto a la próxima stable (1.32) se hace a mano.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Imagen de la API (api/Dockerfile): build en node, runtime distroless.
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    ignore:
      # Sólo LTS: el salto de major (24 -> 26) se hace a mano cuando la nueva
      # sea LTS. Las majors impares nunca lo son.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    # Las dos bases en un solo PR. Ojo: distroless no tiene tags con versión
    # (el tag es "nonroot"), así que sólo puede llegar un cambio de digest.
    # Sin confirmar que Dependabot lo proponga: vigilar el primer PR.
    groups:
      bases-api:
        patterns: ["*"]

  # Dependencias npm del backend
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    # Se agrupa para no recibir PRs sueltos que chocan en el mismo package-lock.json.
    # fastify y sus plugins @fastify/* van juntos porque se versionan en conjunto.
    # Las major fuera de fastify quedan fuera de "resto" a propósito: llegan en
    # PRs individuales para revisarlas una por una.
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      resto:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Versiones de las actions de tus workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly