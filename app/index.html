  dibujarSpriteHelena();
  ctx.restore();
}

/* --------------------------------------------------------------------------
   JUICE — partículas y textos flotantes.
   Se dibujan DENTRO del transform de la cámara (viven en el mundo), encima de
   plataformas, enemigos y Helena.
   -------------------------------------------------------------------------- */

/** Partículas: se desvanecen y se achican a medida que se les acaba la vida */
function dibujarParticulas() {
  for (let i = 0; i < particulas.length; i++) {
    const p = particulas[i];
    if (!p.viva) continue;

    const k = p.vida / p.vidaMax;              // 1 al nacer → 0 al morir
    ctx.globalAlpha = Math.min(1, k * 1.8);    // fade-out sobre el final
    const tam = Math.max(1, p.tam * k);        // y va encogiendo

    if (p.forma === 1) {
      dibujarEstrella(p.x, p.y, tam, p.color); // estrellitas del coleccionable
    } else {
      ctx.fillStyle = p.color;                 // chispas y polvillo: cuadraditos
      ctx.fillRect(p.x - tam / 2, p.y - tam / 2, tam, tam);
    }
  }
  ctx.globalAlpha = 1;                         // dejamos el contexto limpio
}

/** Textos flotantes: contorno oscuro para que se lean sobre el fondo neón */
function dibujarTextosFlotantes() {
  ctx.textAlign = "center";
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(11, 7, 22, .9)";

  for (let i = 0; i < textos.length; i++) {
    const t = textos[i];
    if (!t.viva) continue;

    const k = t.vida / t.vidaMax;
    ctx.globalAlpha = Math.min(1, k * 2.2);    // se apaga en el último tramo
    ctx.font = t.fuente;                       // fuente precalculada (sin basura)
    ctx.strokeText(t.texto, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.texto, t.x, t.y);
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

/** Corazón del HUD, con shapes */
function dibujarCorazon(x, y, tam, lleno) {
  ctx.fillStyle = lleno ? COLOR.corazon : COLOR.corazonVacio;
  ctx.beginPath();
  const t = tam / 2;
  ctx.moveTo(x + t, y + tam * 0.95);
  ctx.bezierCurveTo(x - tam * 0.15, y + tam * 0.55, x + tam * 0.1, y - tam * 0.12, x + t, y + tam * 0.28);
  ctx.bezierCurveTo(x + tam * 0.9, y - tam * 0.12, x + tam * 1.15, y + tam * 0.55, x + t, y + tam * 0.95);
  ctx.closePath();
  ctx.fill();
}

/** Texto con brillo neón (uso puntual: HUD y pantallas) */
function textoNeon(txt, x, y, tam, color, brillo, alineacion) {
  ctx.save();
  ctx.font = "bold " + tam + "px 'Trebuchet MS', system-ui, sans-serif";
  ctx.textAlign = alineacion || "left";
  ctx.textBaseline = "alphabetic";
  ctx.shadowColor = brillo || color;
  ctx.shadowBlur = tam * 0.5;
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
  ctx.restore();
}

/** HUD: vidas, puntaje, high score y aviso de combo */
function dibujarHUD() {
  // Corazones
  for (let i = 0; i < JUEGO.vidasIniciales; i++) {
    dibujarCorazon(16 + i * 26, 14, 20, i < vidas);
  }
  // Puntaje y high score
  textoNeon("PUNTOS " + puntaje, ANCHO_VISTA - 16, 30, 20, COLOR.hudTexto, COLOR.neonCyan, "right");
  textoNeon("BEST " + highScore, ANCHO_VISTA - 16, 52, 14, "rgba(234,246,255,.7)", COLOR.neonRosa, "right");

  // Aviso de combo activo
  if (comboContador >= JUEGO.comboMinimo && comboReloj > 0) {
    textoNeon("COMBO x" + JUEGO.comboMultip, ANCHO_VISTA / 2, 44, 24, COLOR.neonRosa, COLOR.neonRosa, "center");
  }
}

/** Pantalla de inicio con título neón K-pop */
function dibujarPantallaInicio() {
  ctx.fillStyle = "rgba(11, 7, 22, .72)";
  ctx.fillRect(0, 0, ANCHO_VISTA, ALTO_VISTA);

  const pulso = 1 + Math.sin(tiempoTotal * 3) * 0.02;
  ctx.save();
  ctx.translate(ANCHO_VISTA / 2, ALTO_VISTA / 2 - 60);
  ctx.scale(pulso, pulso);
  textoNeon("PRINCESS", 0, 0, 68, "#ffffff", COLOR.neonRosa, "center");
  textoNeon("HELENA", 0, 66, 68, COLOR.neonCyan, COLOR.neonCyan, "center");
  ctx.restore();

  // Parpadeo del llamado a la acción
  if (Math.floor(tiempoTotal * 1.6) % 2 === 0) {
    textoNeon("PRESIONA ESPACIO", ANCHO_VISTA / 2, ALTO_VISTA / 2 + 110, 24, "#ffffff", COLOR.neonRosa, "center");
  }
  textoNeon("← → mover   •   ESPACIO / ↑ saltar",
            ANCHO_VISTA / 2, ALTO_VISTA - 40, 15, "rgba(234,246,255,.65)", COLOR.neonCyan, "center");

  // Ranking global en un rincón, sólo si la API trajo datos
  dibujarPanelTop(664, 296, 280, API_TOP_LIMIT);
}

/* --------------------------------------------------------------------------
   LEADERBOARD — sólo se dibuja si la API contestó. Si no hay datos, estas dos
   funciones no pintan nada y las pantallas quedan igual que en la v1.
   -------------------------------------------------------------------------- */

/** Panel neón con el top del ranking global */
function dibujarPanelTop(x, y, ancho, cuantos) {
  const filas = Math.min(cuantos, leaderboard.length);
  if (filas === 0) return;                 // sin datos, no se dibuja la sección

  const altoFila = 26;
  const alto = 46 + filas * altoFila;

  // Caja con borde neón
  ctx.fillStyle = "rgba(20, 10, 43, .72)";
  ctx.fillRect(x, y, ancho, alto);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(86, 232, 255, .45)";
  ctx.strokeRect(x + 1, y + 1, ancho - 2, alto - 2);

  textoNeon("TOP " + filas + " MUNDIAL", x + ancho / 2, y + 27, 17,
            COLOR.neonCyan, COLOR.neonCyan, "center");

  for (let i = 0; i < filas; i++) {
    const e = leaderboard[i];
    const fy = y + 50 + i * altoFila;
    // Resaltamos en rosa la fila del jugador, si el servidor le dio ese puesto
    const mia = (envioEstado === ENVIO.OK && e.rank === envioRank);
    const color = mia ? COLOR.neonRosa : "rgba(234, 246, 255, .85)";
    const brillo = mia ? COLOR.neonRosa : COLOR.neonCyan;
    textoNeon(e.rank + ".",       x + 16,         fy, 16, color, brillo, "left");
    textoNeon(e.player,           x + 54,         fy, 16, color, brillo, "left");
    textoNeon(String(e.score),    x + ancho - 16, fy, 16, color, brillo, "right");
  }
}

/** Las 3 casillas estilo arcade donde se cargan las iniciales */
function dibujarEntradaIniciales(cx, y) {
  const w = 42, h = 50, sep = 12;
  const total = INICIALES_LARGO * w + (INICIALES_LARGO - 1) * sep;
  let x = cx - total / 2;
  const editando = (envioEstado === ENVIO.EDITANDO);

  for (let i = 0; i < INICIALES_LARGO; i++) {
    const activa = editando && (i === inicialSel);

    ctx.fillStyle = "rgba(255, 255, 255, .05)";
    ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 2;
    ctx.strokeStyle = activa ? COLOR.neonRosa : "rgba(86, 232, 255, .40)";
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

    textoNeon(iniciales[i], x + w / 2, y + h - 14, 30, "#ffffff",
              activa ? COLOR.neonRosa : COLOR.neonCyan, "center");

    // Guion parpadeante bajo la casilla que se está editando
    if (activa && Math.floor(tiempoTotal * 2.5) % 2 === 0) {
      ctx.fillStyle = COLOR.neonRosa;
      ctx.fillRect(x + 7, y + h + 6, w - 14, 3);
    }
    x += w + sep;
  }
}

/** Pantalla de game over */
function dibujarPantallaGameOver() {
  ctx.fillStyle = "rgba(11, 7, 22, .8)";
  ctx.fillRect(0, 0, ANCHO_VISTA, ALTO_VISTA);

  const conEntrada = (envioEstado !== ENVIO.INACTIVO);
  const conTop     = (leaderboard.length > 0);

  // ---- Camino SIN leaderboard: exactamente la pantalla de siempre ----
  if (!conEntrada && !conTop) {
    textoNeon("GAME OVER", ANCHO_VISTA / 2, ALTO_VISTA / 2 - 60, 56, "#ffffff", COLOR.neonRosa, "center");
    textoNeon("PUNTAJE  " + puntaje, ANCHO_VISTA / 2, ALTO_VISTA / 2 + 4, 28, COLOR.neonCyan, COLOR.neonCyan, "center");
    textoNeon("HIGH SCORE  " + highScore, ANCHO_VISTA / 2, ALTO_VISTA / 2 + 42, 20, "rgba(234,246,255,.8)", COLOR.neonRosa, "center");

    if (Math.floor(tiempoTotal * 1.6) % 2 === 0) {
      textoNeon("PRESIONA ESPACIO PARA REINICIAR",
                ANCHO_VISTA / 2, ALTO_VISTA / 2 + 110, 20, "#ffffff", COLOR.neonRosa, "center");
    }
    return;
  }

  // ---- Camino CON leaderboard: resumen a la izquierda, ranking a la derecha ----
  const cx = conTop ? 292 : ANCHO_VISTA / 2;

  textoNeon("GAME OVER", cx, 152, 46, "#ffffff", COLOR.neonRosa, "center");
  textoNeon("PUNTAJE  " + puntajeFinal, cx, 198, 24, COLOR.neonCyan, COLOR.neonCyan, "center");
  textoNeon("HIGH SCORE  " + highScore, cx, 228, 16, "rgba(234,246,255,.8)", COLOR.neonRosa, "center");

  if (conEntrada) {
    textoNeon("TUS INICIALES", cx, 270, 14, "rgba(234,246,255,.6)", COLOR.neonCyan, "center");
    dibujarEntradaIniciales(cx, 284);
    // Estado del envío: ayuda, "ENVIANDO...", el puesto conseguido o el aviso
    // discreto de que no hubo conexión. Nunca bloquea nada.
    const colorMsg = (envioEstado === ENVIO.ERROR) ? "rgba(255,140,170,.85)"
                                                   : "rgba(234,246,255,.7)";
    textoNeon(envioMensaje, cx, 366, 14, colorMsg, COLOR.neonCyan, "center");
  }

  if (conTop) dibujarPanelTop(592, 124, 320, API_TOP_LIMIT);

  if (Math.floor(tiempoTotal * 1.6) % 2 === 0) {
    textoNeon("ESPACIO PARA REINICIAR",
              ANCHO_VISTA / 2, ALTO_VISTA - 34, 18, "#ffffff", COLOR.neonRosa, "center");
  }
}

/** DRAW principal */
function draw() {
  dibujarFondo();

  // --- Mundo: todo lo que sigue se dibuja en coordenadas del nivel ---
  ctx.save();
  // Redondeamos la cámara para que el pixel art no "vibre" entre píxeles
  ctx.translate(-Math.round(camara.x) + camara.shakeX, camara.shakeY);

  dibujarPlataformas();
  dibujarColeccionables();
  dibujarEnemigos();
  dibujarHelena();
  dibujarParticulas();        // el juice va encima del mundo...
  dibujarTextosFlotantes();   // ...y los textos encima de todo

  ctx.restore();

  // --- Capa de interfaz (coordenadas de pantalla) ---
  if (estado === ESTADO.JUGANDO) dibujarHUD();
  if (estado === ESTADO.INICIO)   dibujarPantallaInicio();
  if (estado === ESTADO.GAMEOVER) { dibujarHUD(); dibujarPantallaGameOver(); }
}


/* ==========================================================================
   7) LOOP + ARRANQUE
   requestAnimationFrame con deltaTime en segundos y clamp de seguridad.
   ========================================================================== */

let ultimoTiempo = 0;

function loop(ahora) {
  // La primera llamada no tiene un "anterior" válido
  if (!ultimoTiempo) ultimoTiempo = ahora;

  let dt = (ahora - ultimoTiempo) / 1000;
  ultimoTiempo = ahora;

  // Clamp: si la pestaña estuvo en segundo plano, dt sería enorme y rompería la física
  if (dt > JUEGO.dtMax) dt = JUEGO.dtMax;

  update(dt);
  draw();

  // El flanco del salto se consume UNA sola vez por frame
  saltoRecienPresionado = false;

  requestAnimationFrame(loop);
}

// El loop arranca YA: el juego no espera absolutamente nada de la red.
requestAnimationFrame(loop);

// Sondeo único del leaderboard, en paralelo y sin bloquear. Si contesta, se
// enciende la UI del ranking; si no, el juego sigue como si no existiera.
// El .catch() final es un cinturón extra: sondearAPI() ya traga sus errores.
sondearAPI().catch(() => { apiDisponible = false; });
</script>
