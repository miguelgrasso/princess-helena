# Cache-Control resuelto por mapa en vez de add_header dentro de cada location:
# un add_header a nivel location DESCARTA todos los heredados del server, y con
# eso se perderían las cabeceras de seguridad. Un solo set de add_header arriba.
#
# Por defecto nada se cachea (errores incluidos): si un Ingress mal configurado
# manda /api/* acá, el 404 no debe quedar guardado en el navegador.
# Sólo el juego servido con éxito lleva "no-cache" (revalidar siempre).
# La clave efectiva de la raíz es /index.html: try_files reescribe $uri antes
# de que se evalúe add_header. Por eso no hay entrada para "/".
map "$status:$uri" $ph_cache_control {
    default              "no-store";
    "200:/index.html"    "no-cache, must-revalidate";
}

# RFC 9110: un 405 debe decir qué métodos sí se aceptan.
# Un add_header con valor vacío no se envía, así que sólo sale en el 405.
map $status $ph_allow {
    default  "";
    405      "GET, HEAD";
}

server {
    # Puerto no privilegiado: el contenedor corre sin root y no puede bindear <1024.
    # Sólo IPv4: "listen [::]" hace que nginx no arranque en nodos con IPv6
    # deshabilitado. Si el cluster es IPv6/dual-stack, agregar "listen [::]:8080;".
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;

    # No filtrar la versión de nginx en respuestas ni en páginas de error.
    server_tokens off;

    # --- Hardening de cabeceras (nivel server: se heredan en todo el sitio) ---
    # El juego es un único HTML con JS/CSS inline: por eso 'unsafe-inline'.
    # connect-src 'self' habilita el fetch al leaderboard (/api/*) del mismo origen.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options        "nosniff"         always;
    add_header X-Frame-Options               "DENY"            always;
    add_header Referrer-Policy               "no-referrer"     always;
    add_header Permissions-Policy            "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy    "same-origin"     always;
    add_header Cross-Origin-Resource-Policy  "same-origin"     always;
    add_header Cache-Control                 $ph_cache_control always;
    add_header Allow                         $ph_allow         always;

    # Sin ETag ni revalidación por fecha. El build fija el mtime en 1970, así que
    # el ETag dependería sólo del TAMAÑO: cambiar un color por otro del mismo
    # largo daría el mismo ETag, el navegador recibiría 304 y seguiría viendo
    # la versión vieja después del deploy. Sin validadores, cada recarga baja el
    # HTML completo (29 KB comprimido).
    etag               off;
    if_modified_since  off;

    # Sólo lectura: cualquier verbo que no sea GET/HEAD se rechaza.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Sirve el .gz precomprimido en build (no gasta CPU en runtime).
    # gzip_vary avisa a las cachés intermedias que la respuesta depende de
    # Accept-Encoding, para que no le entreguen gzip a quien no lo pidió.
    # gzip_proxied any: por defecto nginx NO sirve el .gz si la request trae
    # cabecera Via (la agregan CDNs como CloudFront, LBs cloud o proxies
    # corporativos) y el juego bajaría 91 KB sin comprimir. Es seguro: el HTML
    # es igual para todos y ya se envía Vary.
    gzip_static   on;
    gzip_vary     on;
    gzip_proxied  any;

    # Nada de listados de directorio.
    autoindex off;

    # Liveness para kubelet / HEALTHCHECK. No toca disco.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ficheros ocultos: fuera.
    location ~ /\. { return 404; }

    # El .gz existe sólo para gzip_static, que lo abre internamente al servir
    # /index.html (sin pasar por locations). Pedirlo directo no tiene uso.
    location = /index.html.gz { return 404; }

    # La raíz sirve el juego explícitamente. Con "try_files $uri" a secas, "/" es
    # un directorio, no un archivo, y devolvería 404. No se usa "$uri/" para no
    # generar redirecciones 301 absolutas (rompen detrás de un Ingress con TLS).
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
