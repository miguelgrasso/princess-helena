# Config principal propia: reemplaza la de la imagen base.
# Motivo: la base trae "worker_processes auto", que cuenta las CPU del NODO y no
# el límite de CPU del pod. En una máquina de 16 hilos, cada pod levantaría 16
# workers y podría morir por OOM con un limits.memory ajustado.

# Un worker sobra para servir un HTML estático. Más capacidad = más réplicas.
worker_processes  1;

# En la imagen base estos logs son enlaces a /dev/stderr y /dev/stdout.
error_log  /var/log/nginx/error.log notice;

# IMPORTANTE: el pid y TODAS las rutas temporales van a /tmp. Con
# readOnlyRootFilesystem, /tmp (emptyDir) es lo único escribible. Si falta una
# sola de estas líneas, nginx intenta escribir en /var/cache/nginx o /var/run y
# el pod entra en CrashLoop.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
